name: 🚀 Automated Release

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: write

jobs:
  # 阶段 1: 在 dev 分支准备发布 (Bump version & CHANGELOG)
  prepare-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 这里仍然建议使用 RELEASE_TOKEN (PAT) 推送回 dev，
          # 如果没有配置，将回退到默认 GITHUB_TOKEN。
          # 推送到 dev 通常比推送 main 更宽松。
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏷️ Bump Version on Dev
        id: bump
        env:
          HUSKY: "0"
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 检查是否有需要发布的内容 (feat/fix)
          # 如果没有变更，standard-version 会静默跳过
          if npx standard-version --releaseCommitMessageFormat "chore(release): {{currentTag}} [skip ci]"; then
            echo "bumped=true" >> $GITHUB_OUTPUT
            echo "tag=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
          else
            echo "bumped=false" >> $GITHUB_OUTPUT
          fi

      - name: 📤 Push back to Dev
        if: steps.bump.outputs.bumped == 'true'
        env:
          HUSKY: "0"
        run: |
          # 仅推送到 dev 分支。注意：我们故意不在这里推送到标签，
          # 这样标签会随着 PR 合并一起带入 main，或者在 main 阶段重新打标。
          git push origin dev

  # 阶段 2: 在 main 分支正式发布 (Create GitHub Release)
  publish-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'chore(release)')
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Get Current Tag
        id: get_tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v$(node -p "require('./package.json').version")")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: 🎁 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Release ${{ steps.get_tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
