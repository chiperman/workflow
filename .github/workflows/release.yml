name: 🚀 Automated Release

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: 📦 Bump & Release
    runs-on: ubuntu-latest
    # 仅在 dev 分支且提交信息不含 [skip ci] 时运行
    if: github.ref == 'refs/heads/dev' && !contains(github.event.head_commit.message, '[skip ci]')
    
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏷️ Bump Version & Generate Changelog
        id: bump
        env:
          HUSKY: "0"
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 执行版本自增和本地提交
          npx standard-version --releaseCommitMessageFormat "chore(release): {{currentTag}} [skip ci]"
          
          # 获取生成的最新 Tag 名
          NEW_TAG=$(git describe --tags --abbrev=0)
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          
          # 提取最新的 Changelog 内容作为 Release Notes
          # 获取最近两个 ## 之间的内容
          sed -n '/^## / {p; :a; n; /^## /q; p; ba}' CHANGELOG.md | sed '1d' > RELEASE_NOTE.md

      - name: 📤 Push Changes & Tag
        run: |
          git push origin dev --follow-tags

      - name: 🎁 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: Release ${{ steps.bump.outputs.tag }}
          body_path: RELEASE_NOTE.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
