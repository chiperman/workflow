name: 🚀 Automated Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: 📦 Bump & Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: 🔐 Select release token
        run: echo "RELEASE_TOKEN=${{ github.token }}" >> "$GITHUB_ENV"

      - name: 🔎 Determine release type
        id: plan
        run: node scripts/determine-release.mjs

      - name: ⏭️ Skip when no release-worthy commits exist
        if: steps.plan.outputs.should_release != 'true'
        run: echo "No feat/fix/perf/revert/BREAKING CHANGE commits since the last tag. Skip release."

      - name: 🟢 Setup Node.js
        if: steps.plan.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        if: steps.plan.outputs.should_release == 'true'
        run: npm ci

      - name: 🔍 Lint check
        if: steps.plan.outputs.should_release == 'true'
        run: npm run lint:check

      - name: 🔠 Type check
        if: steps.plan.outputs.should_release == 'true'
        run: npm run type-check

      - name: 🧪 Run tests
        if: steps.plan.outputs.should_release == 'true'
        run: npm test -- --runInBand

      - name: 🏗️ Build check
        if: steps.plan.outputs.should_release == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder-key

      - name: 🏷️ Bump Version & Generate Changelog
        if: steps.plan.outputs.should_release == 'true'
        id: bump
        env:
          HUSKY: '0'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          npx standard-version \
            --release-as "${{ steps.plan.outputs.release_as }}" \
            --releaseCommitMessageFormat "chore(release): {{currentTag}} [skip ci]"

          NEW_TAG=$(git describe --tags --abbrev=0)
          RELEASE_SHA=$(git rev-parse HEAD)
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "release_sha=$RELEASE_SHA" >> $GITHUB_OUTPUT

          sed -n '/^## / {p; :a; n; /^## /q; p; ba}' CHANGELOG.md | sed '1d' > RELEASE_NOTE.md

      - name: 📤 Push Changes & Tag to Main
        if: steps.plan.outputs.should_release == 'true'
        run: |
          git push origin HEAD:main --follow-tags

      - name: 🎁 Create GitHub Release
        if: steps.plan.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: Release ${{ steps.bump.outputs.tag }}
          body_path: RELEASE_NOTE.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ env.RELEASE_TOKEN }}
